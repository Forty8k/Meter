name: Meter F8K Analyser

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyser/**'
      - '.github/workflows/analyser.yml'

permissions:
  contents: write

concurrency:
  group: analyser-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja
      - name: Install JUCE's Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev ninja-build
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Get JUCE
        run: git submodule update --init --depth 1 JUCE
      - name: Configure
        run: cmake -S analyser -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: grep -iE "error|fatal" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Self-test (capture and original scoring)
        run: ./build/F8KSelfTest
      - name: End-to-end check (command line on generated tones)
        run: |
          python3 - <<'PY' || python - <<'PY2'
          import wave, struct, math, random
          def w(name, f, amp, sr=44100, secs=8, noise=0.0):
              with wave.open(name, "wb") as o:
                  o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
                  fr = bytearray()
                  for i in range(sr*secs):
                      v = amp*math.sin(2*math.pi*f*i/sr) + noise*random.uniform(-1, 1)
                      s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
                  o.writeframes(bytes(fr))
          w("t_sine50.wav", 50, 0.5); w("t_sine2k.wav", 2000, 0.5); w("t_noise.wav", 1, 0.0, noise=0.4)
          sr = 44100
          with wave.open("t_beat128_Amin.wav", "wb") as o:
              o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
              fr = bytearray(); beat = 60/128
              for i in range(sr*12):
                  t = i/sr; tb = t % beat; th = (t + beat/2) % beat
                  v = 0.7*math.exp(-tb*25)*math.sin(2*math.pi*(50+100*math.exp(-tb*30))*tb) + 0.12*math.exp(-th*80)*random.uniform(-1,1) + 0.15*math.sin(2*math.pi*110*t)
                  for st in (0, 3, 7): v += 0.07*math.sin(2*math.pi*220*2**(st/12)*t)
                  s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
              o.writeframes(bytes(fr))
          PY
          import wave, struct, math, random
          def w(name, f, amp, sr=44100, secs=8, noise=0.0):
              with wave.open(name, "wb") as o:
                  o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
                  fr = bytearray()
                  for i in range(sr*secs):
                      v = amp*math.sin(2*math.pi*f*i/sr) + noise*random.uniform(-1, 1)
                      s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
                  o.writeframes(bytes(fr))
          w("t_sine50.wav", 50, 0.5); w("t_sine2k.wav", 2000, 0.5); w("t_noise.wav", 1, 0.0, noise=0.4)
          sr = 44100
          with wave.open("t_beat128_Amin.wav", "wb") as o:
              o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
              fr = bytearray(); beat = 60/128
              for i in range(sr*12):
                  t = i/sr; tb = t % beat; th = (t + beat/2) % beat
                  v = 0.7*math.exp(-tb*25)*math.sin(2*math.pi*(50+100*math.exp(-tb*30))*tb) + 0.12*math.exp(-th*80)*random.uniform(-1,1) + 0.15*math.sin(2*math.pi*110*t)
                  for st in (0, 3, 7): v += 0.07*math.sin(2*math.pi*220*2**(st/12)*t)
                  s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
              o.writeframes(bytes(fr))
          PY2
          CLI=build/MeterF8KAnalyserCLI_artefacts/Release/MeterF8KAnalyserCLI
          "$CLI" --library testlib t_sine50.wav t_sine2k.wav t_noise.wav t_beat128_Amin.wav | tee cli.txt
          "$CLI" --library testlib t_sine50.wav | tee -a cli.txt
          ls -la testlib/tracks
          while IFS= read -r l; do echo "::notice title=CLI ${{ matrix.name }}::$l"; done < cli.txt
          cut -d, -f2,17,27-32 testlib/index.csv | while IFS= read -r l; do echo "::notice title=index ${{ matrix.name }}::$l"; done
      - name: Window app starts (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          set +e
          xvfb-run -a timeout 8 "build/MeterF8KAnalyser_artefacts/Release/Meter F8K Analyser"; code=$?
          echo "exit code $code (124 = still running when stopped, which is what we want)"
          echo "::notice title=GUI Linux::exit code $code"
          [ $code -eq 124 ]
      - name: Pictures of the window (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" "build/MeterF8KAnalyser_artefacts/Release/Meter F8K Analyser" --snapshot "$PWD/testlib" "$PWD/shots" || true
          ls -la shots
          cd shots && git init -q && git checkout -q -b ci-shots && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "window pictures ${{ github.sha }}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
      - name: Window app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/MeterF8KAnalyser_artefacts/Release/Meter F8K Analyser.exe" -PassThru
          Start-Sleep -Seconds 8
          $alive = -not $p.HasExited
          Write-Output "::notice title=GUI Windows::still running after 8 s: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force } else { exit 1 }
      - name: Package
        run: |
          mkdir -p package
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp "build/MeterF8KAnalyser_artefacts/Release/Meter F8K Analyser.exe" package/
            cp "build/MeterF8KAnalyserCLI_artefacts/Release/MeterF8KAnalyserCLI.exe" package/
          else
            cp "build/MeterF8KAnalyser_artefacts/Release/Meter F8K Analyser" package/
            cp "build/MeterF8KAnalyserCLI_artefacts/Release/MeterF8KAnalyserCLI" package/
          fi
          cp analyser/HOW-TO.txt package/
          cp analyser/tools/f8k_library.py package/
      - uses: actions/upload-artifact@v4
        with:
          name: Meter-F8K-Analyser-${{ matrix.name }}
          path: package
