name: meterDARK Analyser

on:
  workflow_dispatch:
  push:
    paths:
      - 'analyser/**'
      - '.github/workflows/analyser.yml'

permissions:
  contents: write

concurrency:
  group: analyser-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja
      - name: Install JUCE's Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev ninja-build
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Get JUCE
        run: git submodule update --init --depth 1 JUCE
      - name: Configure
        run: cmake -S analyser -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DF8K_BUILD_NUMBER=${{ github.run_number }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: grep -iE "error|fatal" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Self-test (capture and original scoring)
        run: ./build/F8KSelfTest
      - name: Level test (hint readings must not move with level)
        run: ./build/F8KLevelTest | tee leveltest.txt
      - name: Replay test (stored windows with gain = really scaled audio)
        run: ./build/F8KReplayTest | tee replaytest.txt
      - name: Replay block precision test (packed windows must give the same grade, bonus and tone)
        run: ./build/F8KPackTest | tee packtest.txt
      - name: Lean record test (build, save, read, regrade from the replay block)
        run: ./build/F8KLeanTest
      - name: End-to-end check (command line on generated tones)
        run: |
          python3 - <<'PY' || python - <<'PY2'
          import wave, struct, math, random
          def w(name, f, amp, sr=44100, secs=8, noise=0.0):
              with wave.open(name, "wb") as o:
                  o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
                  fr = bytearray()
                  for i in range(sr*secs):
                      v = amp*math.sin(2*math.pi*f*i/sr) + noise*random.uniform(-1, 1)
                      s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
                  o.writeframes(bytes(fr))
          w("t_sine50.wav", 50, 0.5); w("t_sine2k.wav", 2000, 0.5); w("t_noise.wav", 1, 0.0, noise=0.4)
          sr = 44100
          with wave.open("t_beat128_Amin.wav", "wb") as o:
              o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
              fr = bytearray(); beat = 60/128
              for i in range(sr*12):
                  t = i/sr; tb = t % beat; th = (t + beat/2) % beat
                  v = 0.7*math.exp(-tb*25)*math.sin(2*math.pi*(50+100*math.exp(-tb*30))*tb) + 0.12*math.exp(-th*80)*random.uniform(-1,1) + 0.15*math.sin(2*math.pi*110*t)
                  for st in (0, 3, 7): v += 0.07*math.sin(2*math.pi*220*2**(st/12)*t)
                  s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
              o.writeframes(bytes(fr))
          PY
          import wave, struct, math, random
          def w(name, f, amp, sr=44100, secs=8, noise=0.0):
              with wave.open(name, "wb") as o:
                  o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
                  fr = bytearray()
                  for i in range(sr*secs):
                      v = amp*math.sin(2*math.pi*f*i/sr) + noise*random.uniform(-1, 1)
                      s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
                  o.writeframes(bytes(fr))
          w("t_sine50.wav", 50, 0.5); w("t_sine2k.wav", 2000, 0.5); w("t_noise.wav", 1, 0.0, noise=0.4)
          sr = 44100
          with wave.open("t_beat128_Amin.wav", "wb") as o:
              o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
              fr = bytearray(); beat = 60/128
              for i in range(sr*12):
                  t = i/sr; tb = t % beat; th = (t + beat/2) % beat
                  v = 0.7*math.exp(-tb*25)*math.sin(2*math.pi*(50+100*math.exp(-tb*30))*tb) + 0.12*math.exp(-th*80)*random.uniform(-1,1) + 0.15*math.sin(2*math.pi*110*t)
                  for st in (0, 3, 7): v += 0.07*math.sin(2*math.pi*220*2**(st/12)*t)
                  s = int(max(-1, min(1, v))*32767); fr += struct.pack("<hh", s, s)
              o.writeframes(bytes(fr))
          PY2
          CLI=build/MeterF8KAnalyserCLI_artefacts/Release/MeterF8KAnalyserCLI
          "$CLI" --library testlib t_sine50.wav t_sine2k.wav t_noise.wav t_beat128_Amin.wav | tee cli.txt
          "$CLI" --library testlib t_sine50.wav | tee -a cli.txt
          # a 48 kHz file, so the converted-rate files exist for both anchors
          python3 -c "
          import wave, struct, math
          sr=48000
          with wave.open('t_48k.wav','wb') as o:
              o.setnchannels(2); o.setsampwidth(2); o.setframerate(sr)
              fr=bytearray()
              for i in range(sr*8):
                  t=i/sr; v=0.4*math.sin(2*math.pi*220*t)+0.2*math.sin(2*math.pi*3100*t)*(0.5+0.5*math.sin(2*math.pi*3*t))
                  s=int(v*32767); fr+=struct.pack('<hh',s,s)
              o.writeframes(bytes(fr))
          " || python -c "print('no python')"
          "$CLI" --library testlib t_48k.wav | tee -a cli.txt
          ls testlib | tee -a cli.txt
          for f in testlib/grades-*@44100.csv testlib/grades-*@96000.csv; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          ls testlib/tracks/*@44100.f32.gz testlib/tracks/*@96000.f32.gz
          grep -q rate_runs testlib/tracks/*.meta.json
          # Rescan: pretend the library was scanned by an older analyser, then rescan it
          python3 - <<'PYR' || python - <<'PYR2'
          import csv
          rows=list(csv.reader(open('testlib/index.csv', newline='')))
          c=rows[0].index('capture_version')
          for r in rows[1:]: r[c]='1.1'
          csv.writer(open('testlib/index.csv','w',newline='')).writerows(rows)
          PYR
          import csv
          rows=list(csv.reader(open('testlib/index.csv', newline='')))
          c=rows[0].index('capture_version')
          for r in rows[1:]: r[c]='1.1'
          csv.writer(open('testlib/index.csv','w',newline='')).writerows(rows)
          PYR2
          "$CLI" --library testlib --rescan | tee -a cli.txt
          grep -q "Rescan: 5 of 5" cli.txt
          # Level modes: grade the library with the stored windows plus a gain
          "$CLI" --library testlib --levels | tee -a cli.txt
          trap 'echo "::error title=lean/pack check failed::$(tail -n 12 cli.txt | tr "\n" "|")"' ERR
          "$CLI" --library testlib --lean-check | tee -a cli.txt
          "$CLI" --library testlib --lean | tee -a cli.txt
          grep -q "Replay mismatches: 0" cli.txt
          grep -q "Lean records: 0 built, 5 already there" cli.txt
          ls testlib/lean/*.lnr.gz
          # Share packs: a display pack and a full pack, imported into a different library; no paths in them
          "$CLI" --library testlib --export-pack pack-display.f8kpack | tee -a cli.txt
          "$CLI" --library testlib --export-pack pack-full.f8kpack --full | tee -a cli.txt
          "$CLI" --library testlib2 --import-pack pack-full.f8kpack | tee -a cli.txt
          grep -q "Pack import: 5 records added" cli.txt
          ls testlib2/lean-shared/*.lnr.gz
          if command -v gzip >/dev/null; then
            if gzip -dc pack-full.f8kpack | grep -a -q -e "testlib" -e "t_sine50"; then echo "A pack contains a file name or path"; exit 1; fi
          fi
          [ "$(wc -c < pack-display.f8kpack)" -lt "$(wc -c < pack-full.f8kpack)" ]
          trap - ERR
          grep -q "Levels: normalised 5 of 5" cli.txt
          grep -q "Levels: mix 5 of 5" cli.txt
          ls testlib/levelgrades-*.csv
          cut -d, -f22 testlib/index.csv | sort | uniq -c
          ls -la testlib/tracks
          while IFS= read -r l; do echo "::notice title=CLI ${{ matrix.name }}::$l"; done < cli.txt
          cut -d, -f2,17,27-32 testlib/index.csv | while IFS= read -r l; do echo "::notice title=index ${{ matrix.name }}::$l"; done
      - name: Window app starts (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          set +e
          xvfb-run -a timeout 8 "build/MeterF8KAnalyser_artefacts/Release/meterDARK Analyser"; code=$?
          echo "exit code $code (124 = still running when stopped, which is what we want)"
          echo "::notice title=GUI Linux::exit code $code"
          [ $code -eq 124 ]
      - name: Pictures of the window (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" "build/MeterF8KAnalyser_artefacts/Release/meterDARK Analyser" --snapshot "$PWD/testlib" "$PWD/shots" || true
          ls -la shots
          cd shots && git init -q && git checkout -q -b ci-shots && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "window pictures ${{ github.sha }}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
      - name: Window app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/MeterF8KAnalyser_artefacts/Release/meterDARK Analyser.exe" -PassThru
          Start-Sleep -Seconds 8
          $alive = -not $p.HasExited
          Write-Output "::notice title=GUI Windows::still running after 8 s: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force } else { exit 1 }
      - name: Package
        run: |
          mkdir -p package
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp "build/MeterF8KAnalyser_artefacts/Release/meterDARK Analyser.exe" package/
            cp "build/MeterF8KAnalyserCLI_artefacts/Release/MeterF8KAnalyserCLI.exe" package/
          else
            cp "build/MeterF8KAnalyser_artefacts/Release/meterDARK Analyser" package/
            cp "build/MeterF8KAnalyserCLI_artefacts/Release/MeterF8KAnalyserCLI" package/
          fi
          cp analyser/HOW-TO.txt package/
          cp analyser/tools/f8k_library.py package/
      - uses: actions/upload-artifact@v4
        with:
          name: meterDARK-Analyser-${{ matrix.name }}
          path: package

  release:
    # SWITCHED OFF while the app is still being designed: builds are downloaded from the Actions tab (artifact meterDARK-Analyser-Windows), nothing is published.
    # To publish releases again, change `if: false` back to `if: github.ref == 'refs/heads/analyser'`.
    # (Originally: publishes each successful build as a release, so the app can tell you a newer one exists)
    # (for example after a new original Meter version was added automatically).
    needs: build
    if: false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          versions=$(for f in ../analyser/original/*/upstream.json; do python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$f"; done | sort -V | tr '\n' ' ')
          newest=$(echo $versions | awk '{print $NF}')
          gh release create "analyser-b${{ github.run_number }}" *.zip --target "${{ github.sha }}" \
            --title "meterDARK Analyser build ${{ github.run_number }} (original Meter up to ${newest})" \
            --notes "Original Meter versions included: ${versions}
          Download meterDARK-Analyser-Windows.zip, unzip, and run meterDARK Analyser.exe. Your library is kept: tracks are updated for any new Meter version automatically."
